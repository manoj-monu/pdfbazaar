<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | PDFBazaar</title>
  <meta name="description" content="The page you requested does not exist on PDFBazaar. Return to our free online PDF tools." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/pdf-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" />
  <style>
    :root { --primary: #1321d4; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 540px;
      width: 100%;
      background: #ffffff;
      padding: 48px 32px;
      border-radius: 24px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
    }
    .code {
      font-size: 80px;
      font-weight: 900;
      line-height: 1;
      color: var(--primary);
      margin-bottom: 16px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 12px;
    }
    p {
      color: #64748b;
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 32px;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 28px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      border-radius: 10px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    a.btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>Sorry, the page you are looking for does not exist, has been removed, or the link is invalid.</p>
    <a href="/" class="btn">Return to All PDF Tools</a>
  </div>
</body>
</html>
